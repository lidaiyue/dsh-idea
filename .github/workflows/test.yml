name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # oracledb is optional and needs a client library on some runners.
      - run: npm ci --omit=optional
      - run: npm test
